[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ghostcopyeditor"
version = "0.1.0"
description = "CLI copy editor for Ghost writing suite manuscripts"
requires-python = ">=3.12"
dependencies = [
    "typer[all]>=0.12",
    "rich>=13.0",
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "typesafe-sdk>=0.7.0",
    "langchain-core>=0.3",
    "langchain-openai>=0.2",
    "langchain-anthropic>=0.2",
    "langchain-ollama>=0.2",
    "langchain-xai>=0.2",
    "langchain-google-genai>=4.2.6",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-mock>=3.14",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
    "mypy>=1.10",
]

[project.scripts]
ghostcopyeditor = "ghostcopyeditor.cli:app"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
asyncio_mode = "auto"
addopts = "--import-mode=importlib --cov=ghostcopyeditor --cov-report=html --cov-report=term-missing"

[tool.coverage.run]
branch = true
omit = ["*/tests/*", "*/venv/*", "*/.venv/*"]

[tool.coverage.report]
# The required bar is branch coverage, enforced in tests/branch_gate.py.
# coverage.py's fail_under mixes statements and branches, so it is not the gate.

[tool.ruff]
line-length = 100
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "C4", "DTZ", "T10", "PIE", "PT", "RET", "SIM"]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-mock>=3.14",
    "ruff>=0.5",
    "mypy>=1.10",
    "pytest-asyncio>=0.23",
]
